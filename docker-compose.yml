name: raspadinha-keycloak

services:
  keycloak_db:
    image: mariadb:10.9.3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD fora do repositório}
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: ${KC_DB_PASSWORD:?Defina KC_DB_PASSWORD fora do repositório}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - keycloak-db:/var/lib/mysql
    networks:
      - keycloak-internal

  keycloak:
    image: quay.io/keycloak/keycloak:19.0.2
    command: ["start", "--import-realm"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      KC_DB: mariadb
      KC_DB_URL_HOST: keycloak_db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Defina KC_DB_PASSWORD fora do repositório}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_HOSTNAME: auth-raspadinha.dploy.space
      # Compatibilidade necessária neste host para Keycloak 19/JVM 17/cgroup v2.
      JAVA_OPTS_APPEND: -XX:-UseContainerSupport
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD fora do repositório}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./themes:/opt/keycloak/themes:ro
    networks:
      - keycloak-internal
      - edge
    depends_on:
      keycloak_db:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "edge"
      traefik.http.routers.auth-raspadinha.rule: "Host(`auth-raspadinha.dploy.space`)"
      traefik.http.routers.auth-raspadinha.entrypoints: "websecure"
      traefik.http.routers.auth-raspadinha.tls: "true"
      traefik.http.routers.auth-raspadinha.middlewares: "compress@file,noindex@file"
      traefik.http.services.auth-raspadinha.loadbalancer.server.port: "8080"

networks:
  keycloak-internal:
    internal: true
  edge:
    external: true

volumes:
  keycloak-db:
